# Render "Blueprint": API'yi ücretsiz planda, api/Dockerfile ile yayınlar.
# Veritabanı için Neon (ücretsiz PostgreSQL) kullanılır; DATABASE_URL'yi Render panelinden girin.
# Ayrıntılı adımlar: docs/DEPLOYMENT.md
services:
  - type: web
    name: burgermash-api
    runtime: docker
    plan: free
    region: ohio # Neon veritabanıyla aynı bölge
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon bağlantı adresini panelden elle girin
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Vercel adresiniz, örn. https://burgermash.vercel.app
      - key: SEED_ADMIN_EMAIL
        value: admin@burgermash.dev
      - key: SEED_ADMIN_PASSWORD
        sync: false # Güçlü bir şifre belirleyin
      - key: SEED_KITCHEN_EMAIL
        value: mutfak@burgermash.dev
      - key: SEED_KITCHEN_PASSWORD
        sync: false
