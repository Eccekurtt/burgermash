# Tek komutla tüm sistem:   docker compose up --build
#   Site:    http://localhost:3000
#   API:     http://localhost:4000   (Swagger: /docs)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: burgermash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d burgermash"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/burgermash
      JWT_SECRET: ${JWT_SECRET:-gelistirme-icin-gizli-anahtar-uretimde-degistir}
      CORS_ORIGINS: http://localhost:3000
      PORT: 4000
      # Yalnızca demo hesapları: gerçek bir ortamda değiştirin
      SEED_ADMIN_EMAIL: admin@burgermash.dev
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_KITCHEN_EMAIL: mutfak@burgermash.dev
      SEED_KITCHEN_PASSWORD: ${SEED_KITCHEN_PASSWORD:-mutfak12345}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        # Tarayıcı API'ye bu adresten ulaşır (konteyner içi ad değil)
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
